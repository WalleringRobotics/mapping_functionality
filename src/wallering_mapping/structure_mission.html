<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structure fly-by mission</title>
<style>
  :root {
    --bg: #11151c; --panel: #1a202b; --line: #2c3545; --text: #e6eaf2; --dim: #97a3b6;
    --pass: #4cc9f0; --corner: #ff7eb6; --move: #c9b458; --idle: #7d8798; --seen: #ffe066;
    --good: #3fb68b; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
  .badge.no { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
  .badge.review { background: #2a3140; color: var(--dim); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--dim); font-size: 13px; }
  .facts b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
    margin: 0; padding: 9px 12px 0; font-weight: 600; }
  #scene-wrap { position: relative; height: min(62vh, 640px); min-height: 360px; }
  #scene { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .tools { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button, .tools label, .transport button, .transport select {
    background: rgba(17, 21, 28, .82); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .tools label { display: flex; align-items: center; gap: 6px; }
  .hint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #cfd6e2;
    background: rgba(17, 21, 28, .7); padding: 2px 7px; border-radius: 5px; }
  .legend { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #cfd6e2; display: flex;
    flex-wrap: wrap; gap: 3px 10px; background: rgba(17, 21, 28, .7); padding: 3px 8px; border-radius: 5px;
    max-width: 70%; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px;
    vertical-align: -1px; }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #frame { width: 100%; display: block; }
  .caption { padding: 6px 12px 10px; color: var(--dim); font-size: 12.5px; }
  .caption b { color: var(--text); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; padding: 8px 12px 12px;
    font-variant-numeric: tabular-nums; }
  dt { color: var(--dim); } dd { margin: 0; text-align: right; }
  #now-step { padding: 8px 12px 0; font-weight: 600; }
  #now-detail { padding: 0 12px; color: var(--dim); font-size: 12.5px; }
  .lower { padding: 0 16px 12px; display: grid; gap: 12px; }
  .transport { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; flex-wrap: wrap; }
  .transport #clock { font-variant-numeric: tabular-nums; min-width: 9.5em; }
  #timeline { width: 100%; height: 58px; display: block; cursor: pointer; touch-action: none; }
  #walls { width: 100%; display: block; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
  ol#steps { list-style: none; margin: 6px 0 0; padding: 0; max-height: 300px; overflow: auto; }
  ol#steps li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline;
    padding: 4px 12px; cursor: pointer; border-left: 3px solid transparent; }
  ol#steps li:hover { background: #222a38; }
  ol#steps li.on { background: #253044; border-left-color: var(--seen); }
  ol#steps li span.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  ol#steps li small { color: var(--dim); display: block; }
  ol#steps li time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  details { padding: 8px 12px 10px; color: var(--dim); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--text); }
  details li { margin: 3px 0; }
  footer { padding: 4px 16px 18px; color: var(--dim); font-size: 12px; }
  @media (max-width: 920px) { main, .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Structure fly-by mission</h1>
  <span id="verdict" class="badge"></span>
  <span class="badge review">review only, not flight-ready</span>
  <div class="facts" id="facts"></div>
</header>
<main>
  <section class="panel" id="scene-wrap">
    <canvas id="scene"></canvas>
    <div class="tools">
      <button id="view-oblique">Oblique</button>
      <button id="view-top">Top</button>
      <button id="view-side">Side</button>
      <label><input type="checkbox" id="follow"> Follow</label>
      <label><input type="checkbox" id="satellite" checked> Satellite</label>
      <label><input type="checkbox" id="show-frames" checked> Frames</label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">drag: rotate · shift-drag: pan · wheel: zoom</div>
  </section>
  <aside>
    <section class="panel">
      <h2>Camera frame</h2>
      <canvas id="frame"></canvas>
      <div class="caption" id="frame-caption"></div>
    </section>
    <section class="panel">
      <h2>Now</h2>
      <div id="now-step"></div><div id="now-detail"></div>
      <dl id="now"></dl>
    </section>
  </aside>
</main>
<div class="lower">
  <section class="panel">
    <div class="transport">
      <button id="play">Play</button>
      <button id="prev" title="Previous step">◀ step</button>
      <button id="next" title="Next step">step ▶</button>
      <select id="rate" title="Playback speed">
        <option value="1">1×</option><option value="4">4×</option><option value="10" selected>10×</option>
        <option value="30">30×</option><option value="60">60×</option>
      </select>
      <span id="clock"></span>
    </div>
    <canvas id="timeline"></canvas>
  </section>
  <div class="two">
    <section class="panel">
      <h2>Walls unfolded: lines that see each point sharply</h2>
      <canvas id="walls"></canvas>
      <div class="caption" id="walls-caption"></div>
    </section>
    <section class="panel">
      <h2>Sequence</h2>
      <ol id="steps"></ol>
    </section>
  </div>
  <section class="panel">
    <details open><summary>Warnings and limits of this plan</summary><ul id="notes"></ul></details>
  </section>
</div>
<footer id="footer"></footer>
<script id="mission" type="application/json">__MISSION_DATA__</script>
<script>
"use strict";
const M = JSON.parse(document.getElementById("mission").textContent);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLOR = { pass: css("--pass"), corner: css("--corner"), reposition: css("--move"), transit: css("--idle"),
  takeoff: css("--idle"), climb_out: css("--idle"), return: css("--idle"), land: css("--idle") };
const KIND_NAME = { pass: "pass along a face", corner: "corner stops", reposition: "change of height",
  transit: "transit", takeoff: "take-off", climb_out: "climb out", return: "return", land: "landing" };
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const T = M.keys[M.keys.length - 1][0];
const TOP = M.base_m + M.wall_m, BASE = M.base_m;
const CAM = M.camera, F = CAM.focal_px, HW = CAM.half_width_px, HH = CAM.half_height_px, LOW = CAM.lowest_usable_row_px;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const lerp = (a, b, f) => a + (b - a) * f;
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// ---- flight state -------------------------------------------------------------------------
function stateAt(t) {
  const keys = M.keys;
  t = Math.max(0, Math.min(T, t));
  let lo = 0, hi = keys.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (keys[mid][0] <= t) lo = mid; else hi = mid; }
  const a = keys[lo], b = keys[hi], span = b[0] - a[0], f = span > 0 ? (t - a[0]) / span : 0;
  const speed = span > 0 ? Math.hypot(b[1] - a[1], b[2] - a[2], b[3] - a[3]) / span : 0;
  const yawRate = span > 0 ? Math.abs(b[4] - a[4]) / span : 0;
  return { t, x: lerp(a[1], b[1], f), y: lerp(a[2], b[2], f), z: lerp(a[3], b[3], f),
    yaw: lerp(a[4], b[4], f), speed, yawRate };
}
function stepAt(t) {
  for (let i = 0; i < M.steps.length; i++) if (t < M.steps[i].t1) return i;
  return M.steps.length - 1;
}
function windowAt(t) {
  for (const w of M.windows) { if (t >= w[0] && t <= w[1]) return w[2]; if (w[0] > t) break; }
  return null;
}
const FRAMES = [];
for (let k = 0; k / CAM.fps <= T; k++) {
  const t = k / CAM.fps, kind = windowAt(t);
  if (kind) { const s = stateAt(t); FRAMES.push({ t, x: s.x, y: s.y, z: s.z, kind }); }
}
const PIECES = [];
(function buildPath() {
  for (let i = 1; i < M.keys.length; i++) {
    const a = M.keys[i - 1], b = M.keys[i], length = Math.hypot(b[1] - a[1], b[2] - a[2], b[3] - a[3]);
    if (length < 1e-6) continue;
    const n = Math.max(1, Math.ceil(length / 1.5));
    for (let k = 0; k < n; k++) {
      const f0 = k / n, f1 = (k + 1) / n, t0 = lerp(a[0], b[0], f0), t1 = lerp(a[0], b[0], f1);
      PIECES.push({ a: [lerp(a[1], b[1], f0), lerp(a[2], b[2], f0), lerp(a[3], b[3], f0)],
        b: [lerp(a[1], b[1], f1), lerp(a[2], b[2], f1), lerp(a[3], b[3], f1)], t0, t1,
        kind: M.steps[stepAt((t0 + t1) / 2)].kind });
    }
  }
})();

// ---- camera model (the same as the check) -------------------------------------------------
function camera(s) {
  const yaw = rad(s.yaw), p = rad(CAM.pitch_down_deg);
  const nose = [Math.sin(yaw), Math.cos(yaw), 0];
  return { C: [s.x, s.y, s.z], right: [Math.cos(yaw), -Math.sin(yaw), 0],
    down: [-Math.sin(p) * nose[0], -Math.sin(p) * nose[1], -Math.cos(p)],
    fwd: [Math.cos(p) * nose[0], Math.cos(p) * nose[1], -Math.sin(p)], nose };
}
const toCam = (cam, P) => { const r = sub(P, cam.C); return [dot(r, cam.right), dot(r, cam.down), dot(r, cam.fwd)]; };
function clipPoly(poly, inside, cut) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ia = inside(a), ib = inside(b);
    if (ia) out.push(a);
    if (ia !== ib) out.push(cut(a, b));
  }
  return out;
}
function clipNear(poly) {
  const near = 0.05;
  return clipPoly(poly, p => p[2] >= near, (a, b) => {
    const f = (near - a[2]) / (b[2] - a[2]);
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), near];
  });
}
function clipRect(poly, u0, u1, v0, v1) {
  const edge = (axis, limit, sign) => p => clipPoly(p, q => sign * (q[axis] - limit) <= 0, (a, b) => {
    const f = (limit - a[axis]) / (b[axis] - a[axis]);
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
  });
  for (const step of [edge(0, u0, -1), edge(0, u1, 1), edge(1, v0, -1), edge(1, v1, 1)]) {
    poly = step(poly);
    if (poly.length < 3) return [];
  }
  return poly;
}
const area2 = poly => Math.abs(poly.reduce((sum, p, i) => {
  const q = poly[(i + 1) % poly.length]; return sum + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
function unproject(cam, uv, origin, normal) {
  const d = [0, 1, 2].map(i => uv[0] * cam.right[i] + uv[1] * cam.down[i] + F * cam.fwd[i]);
  const s = dot(sub(origin, cam.C), normal) / dot(d, normal);
  return [cam.C[0] + d[0] * s, cam.C[1] + d[1] * s, cam.C[2] + d[2] * s];
}
const WALLS = M.faces.map(face => {
  const s = face.start, e = face.end;
  return { face, normal: [face.normal[0], face.normal[1], 0], origin: [s[0], s[1], BASE],
    quad: [[s[0], s[1], BASE], [e[0], e[1], BASE], [e[0], e[1], TOP], [s[0], s[1], TOP]] };
});
const ROOF = M.hull.map(p => [p[0], p[1], TOP]);
// A view counts only within the allowed angle from the wall's normal: a disc on the wall
// about the point square-on to the camera.
function limitIncidence(cam, wall, world) {
  if (world.length < 3) return [];
  const face = wall.face, radius = dot(sub(cam.C, wall.origin), wall.normal) * Math.tan(rad(CAM.max_incidence_deg));
  const along = p => (p[0] - face.start[0]) * face.along[0] + (p[1] - face.start[1]) * face.along[1];
  const a0 = along(cam.C), h0 = cam.C[2];
  let poly = world.map(p => [along(p), p[2]]);
  for (let k = 0; k < 24 && poly.length >= 3; k++) {
    const nx = Math.cos(k / 12 * Math.PI), ny = Math.sin(k / 12 * Math.PI);
    const out = q => (q[0] - a0) * nx + (q[1] - h0) * ny - radius;
    poly = clipPoly(poly, q => out(q) <= 0, (a, b) => {
      const f = out(a) / (out(a) - out(b));
      return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
    });
  }
  if (poly.length < 3) return [];
  return poly.map(q => [face.start[0] + face.along[0] * q[0], face.start[1] + face.along[1] * q[0], q[1]]);
}
// What the camera sees of each wall: the whole frame, and the usable band of it.
function seen(cam) {
  const result = [];
  for (const wall of WALLS) {
    if (dot(sub(cam.C, wall.origin), wall.normal) <= 0.01) continue;
    const inCam = clipNear(wall.quad.map(p => toCam(cam, p)));
    if (inCam.length < 3) continue;
    const pix = inCam.map(p => [F * p[0] / p[2], F * p[1] / p[2]]);
    const full = clipRect(pix, -HW, HW, -HH, HH), band = clipRect(pix, -HW, HW, -HH, LOW);
    const bandWorld = limitIncidence(cam, wall, band.map(uv => unproject(cam, uv, wall.origin, wall.normal)));
    result.push({ wall, pix, full, bandWorld,
      band: bandWorld.map(p => { const c = toCam(cam, p); return [F * c[0] / c[2], F * c[1] / c[2]]; }),
      fullWorld: full.map(uv => unproject(cam, uv, wall.origin, wall.normal)) });
  }
  return result;
}

// ---- wall coverage textures ---------------------------------------------------------------
function coverColor(count) {
  const need = M.needed.lines;
  if (count <= 0) return "#b3262d";
  if (count < need) return "#e08a2e";
  return ["#3fb68b", "#2f9fb0", "#3277c2", "#4a57c9"][Math.min(3, count - need)];
}
for (const wall of WALLS) {
  const face = wall.face, cols = face.columns - 1, rows = face.rows - 1;
  const canvas = document.createElement("canvas");
  canvas.width = cols; canvas.height = rows;
  const g = canvas.getContext("2d");
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const at = (rr, cc) => face.lines[rr * face.columns + cc];
    g.fillStyle = coverColor(Math.min(at(r, c), at(r, c + 1), at(r + 1, c), at(r + 1, c + 1)));
    g.fillRect(c, r, 1, 1);
  }
  wall.texture = canvas;
}

// ---- canvases -----------------------------------------------------------------------------
function fit(canvas, height) {
  const dpr = window.devicePixelRatio || 1, width = canvas.clientWidth;
  if (height) canvas.style.height = height + "px";
  const h = canvas.clientHeight;
  if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w: width, h, dpr };
}
function trace(g, points) {
  g.beginPath();
  points.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.closePath();
}

// ---- scene: orthographic view that can be turned and tilted --------------------------------
const xs = M.fence.map(p => p[0]).concat([0]), ys = M.fence.map(p => p[1]).concat([0]);
const BOUNDS = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
const hullCentre = [M.hull.reduce((s, p) => s + p[0], 0) / M.hull.length,
  M.hull.reduce((s, p) => s + p[1], 0) / M.hull.length];
const view = { az: rad(-32), el: rad(34), scale: 0, cx: hullCentre[0], cy: hullCentre[1], cz: TOP / 2 };
let sceneSize = { w: 1, h: 1 };
function resetScale() {
  const reach = Math.max(...M.waypoints.map(w => Math.hypot(w.x - view.cx, w.y - view.cy))) + 6;
  view.scale = Math.min(sceneSize.w, sceneSize.h * 1.25) / (1.9 * reach);
}
function proj(p) {
  const ca = Math.cos(view.az), sa = Math.sin(view.az), se = Math.sin(view.el), ce = Math.cos(view.el);
  const x = p[0] - view.cx, y = p[1] - view.cy;
  const xr = x * ca - y * sa, yr = x * sa + y * ca;
  return [sceneSize.w / 2 + view.scale * xr, sceneSize.h / 2 - view.scale * (yr * se + (p[2] - view.cz) * ce)];
}
const towardViewer = () => [-Math.sin(view.az) * Math.cos(view.el), -Math.cos(view.az) * Math.cos(view.el),
  Math.sin(view.el)];
// Is a point hidden behind the structure from where the viewer stands?
function hidden(P, v) {
  let lo = 1e-6, hi = Infinity;
  const bound = (num, den) => {
    if (Math.abs(den) < 1e-9) return num >= 0;
    if (den < 0) lo = Math.max(lo, num / den); else hi = Math.min(hi, num / den);
    return true;
  };
  for (const wall of WALLS) if (!bound(dot(sub(wall.origin, P), wall.normal), dot(v, wall.normal))) return false;
  if (!bound(TOP - P[2], v[2]) || !bound(P[2] - BASE, -v[2])) return false;
  return lo < hi;
}
function affine(g, dpr, image, o, u, v) {
  const w = image.width, h = image.height;
  g.setTransform(dpr * (u[0] - o[0]) / w, dpr * (u[1] - o[1]) / w, dpr * (v[0] - o[0]) / h, dpr * (v[1] - o[1]) / h,
    dpr * o[0], dpr * o[1]);
  g.drawImage(image, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Satellite tiles on the ground plane. Without a connection the ground stays plain.
const R_EARTH = 6371008.8, lat0 = rad(M.home[0]);
const toLatLon = (x, y) => [M.home[0] + deg(y / R_EARTH), M.home[1] + deg(x / (R_EARTH * Math.cos(lat0)))];
const toLocal = (lat, lon) => [rad(lon - M.home[1]) * R_EARTH * Math.cos(lat0), rad(lat - M.home[0]) * R_EARTH];
const TILES = [];
(function chooseTiles() {
  const pad = 60, sw = toLatLon(BOUNDS.x0 - pad, BOUNDS.y0 - pad), ne = toLatLon(BOUNDS.x1 + pad, BOUNDS.y1 + pad);
  const tx = (lon, n) => (lon + 180) / 360 * n;
  const ty = (lat, n) => (1 - Math.asinh(Math.tan(rad(lat))) / Math.PI) / 2 * n;
  for (let z = M.imagery.max_zoom; z >= 12; z--) {
    const n = 2 ** z, x0 = Math.floor(tx(sw[1], n)), x1 = Math.floor(tx(ne[1], n));
    const y0 = Math.floor(ty(ne[0], n)), y1 = Math.floor(ty(sw[0], n));
    if ((x1 - x0 + 1) * (y1 - y0 + 1) > 60) continue;
    const lon = x => x / n * 360 - 180, lat = y => deg(Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))));
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      TILES.push({ url: M.imagery.url.replace("{z}", z).replace("{y}", y).replace("{x}", x),
        nw: toLocal(lat(y), lon(x)), ne: toLocal(lat(y), lon(x + 1)), sw: toLocal(lat(y + 1), lon(x)) });
    }
    break;
  }
})();
let tilesWanted = false, tilesLoaded = 0;
function loadTiles() {
  if (tilesWanted) return;
  tilesWanted = true;
  for (const tile of TILES) {
    const image = new Image();
    image.onload = () => { tile.image = image; tilesLoaded++; dirty = true; };
    image.src = tile.url;
  }
}

function drawAircraft(g, s, alpha) {
  const yaw = rad(s.yaw), size = Math.max(0.7, 11 / view.scale);
  const nose = [Math.sin(yaw), Math.cos(yaw)], right = [Math.cos(yaw), -Math.sin(yaw)];
  const at = (f, r, up = 0) => proj([s.x + nose[0] * f * size + right[0] * r * size,
    s.y + nose[1] * f * size + right[1] * r * size, s.z + up * size]);
  g.globalAlpha = alpha;
  g.strokeStyle = "#ffffff"; g.lineWidth = 2;
  for (const [f, r] of [[1, 1], [1, -1]]) {
    g.beginPath(); g.moveTo(...at(f, r)); g.lineTo(...at(-f, -r)); g.stroke();
  }
  for (const [f, r] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    g.beginPath();
    for (let k = 0; k <= 16; k++) {
      const a = k / 16 * 2 * Math.PI, p = at(f + 0.55 * Math.cos(a), r + 0.55 * Math.sin(a));
      k ? g.lineTo(...p) : g.moveTo(...p);
    }
    g.fillStyle = f > 0 ? "rgba(255,224,102,.9)" : "rgba(255,255,255,.75)"; g.fill();
  }
  g.strokeStyle = css("--seen"); g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(...at(0, 0)); g.lineTo(...at(2.6, 0)); g.stroke();
  g.globalAlpha = 1;
}

function drawScene(s) {
  const canvas = document.getElementById("scene"), { g, w, h, dpr } = fit(canvas);
  if (w !== sceneSize.w || h !== sceneSize.h) { sceneSize = { w, h }; if (!view.scale) resetScale(); }
  if (document.getElementById("follow").checked) { view.cx = s.x; view.cy = s.y; view.cz = s.z / 2; }
  const satellite = document.getElementById("satellite").checked;
  g.fillStyle = satellite ? "#1b222c" : "#18202a"; g.fillRect(0, 0, w, h);
  if (satellite) {
    loadTiles();
    for (const tile of TILES) if (tile.image) {
      affine(g, dpr, tile.image, proj([...tile.nw, 0]), proj([...tile.ne, 0]), proj([...tile.sw, 0]));
    }
    g.fillStyle = "rgba(10,14,20,.28)"; g.fillRect(0, 0, w, h);
  }
  if (!satellite || !tilesLoaded) {  // ground grid, 10 m
    g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
    const x0 = Math.floor((BOUNDS.x0 - 40) / 10) * 10, x1 = Math.ceil((BOUNDS.x1 + 40) / 10) * 10;
    const y0 = Math.floor((BOUNDS.y0 - 40) / 10) * 10, y1 = Math.ceil((BOUNDS.y1 + 40) / 10) * 10;
    g.beginPath();
    for (let x = x0; x <= x1; x += 10) { g.moveTo(...proj([x, y0, 0])); g.lineTo(...proj([x, y1, 0])); }
    for (let y = y0; y <= y1; y += 10) { g.moveTo(...proj([x0, y, 0])); g.lineTo(...proj([x1, y, 0])); }
    g.stroke();
  }
  // fence, take-off point, north arrow
  g.setLineDash([7, 5]); g.strokeStyle = "#ff5d5d"; g.lineWidth = 1.5;
  trace(g, M.fence.map(p => proj([p[0], p[1], 0]))); g.stroke(); g.setLineDash([]);
  const homePoint = proj([0, 0, 0]);
  g.fillStyle = "#ffffff"; g.beginPath(); g.arc(homePoint[0], homePoint[1], 5, 0, 7); g.fill();
  g.font = "12px system-ui"; g.fillText("take-off", homePoint[0] + 8, homePoint[1] + 4);
  // shadow of the structure on the ground
  g.fillStyle = "rgba(0,0,0,.35)"; trace(g, M.hull.map(p => proj([p[0], p[1], BASE]))); g.fill();

  const v = towardViewer();
  const drawPieces = wantHidden => {
    g.lineCap = "round";
    for (const piece of PIECES) {
      const mid = [(piece.a[0] + piece.b[0]) / 2, (piece.a[1] + piece.b[1]) / 2, (piece.a[2] + piece.b[2]) / 2];
      if (hidden(mid, v) !== wantHidden) continue;
      const flown = piece.t1 <= s.t;
      g.strokeStyle = COLOR[piece.kind];
      g.globalAlpha = (flown ? 1 : 0.38) * (wantHidden ? 0.45 : 1);
      g.lineWidth = flown ? 2.6 : 1.4;
      g.beginPath(); g.moveTo(...proj(piece.a)); g.lineTo(...proj(piece.b)); g.stroke();
    }
    g.globalAlpha = 1;
  };
  const drawFrames = wantHidden => {
    if (!document.getElementById("show-frames").checked) return;
    for (const frame of FRAMES) {
      if (frame.t > s.t) break;
      const p3 = [frame.x, frame.y, frame.z];
      if (hidden(p3, v) !== wantHidden) continue;
      const p = proj(p3);
      g.fillStyle = frame.kind === "pass" ? "#ffffff" : COLOR.corner;
      g.globalAlpha = wantHidden ? 0.35 : 0.9;
      g.fillRect(p[0] - 1.2, p[1] - 1.2, 2.4, 2.4);
    }
    g.globalAlpha = 1;
  };
  drawPieces(true); drawFrames(true);
  // the structure: walls that face the viewer, painted with their coverage, then the roof
  const cam = camera(s), views = seen(cam);
  for (const wall of WALLS) {
    if (dot(wall.normal, v) <= 0) continue;
    const q = wall.quad.map(proj);
    affine(g, dpr, wall.texture, q[3], q[2], q[0]);
    g.strokeStyle = "rgba(10,14,20,.9)"; g.lineWidth = 1.2; trace(g, q); g.stroke();
  }
  if (v[2] > 0) {
    g.fillStyle = "#59647a"; g.strokeStyle = "rgba(10,14,20,.9)";
    trace(g, ROOF.map(proj)); g.fill(); g.stroke();
  }
  // what the camera sees now, on walls that face the viewer
  const imaging = windowAt(s.t);
  for (const item of views) {
    if (dot(item.wall.normal, v) <= 0) continue;
    if (item.full.length >= 3) {
      g.setLineDash([4, 4]); g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 1;
      trace(g, item.fullWorld.map(proj)); g.stroke(); g.setLineDash([]);
    }
    if (item.band.length >= 3) {
      g.fillStyle = imaging ? "rgba(255,224,102,.5)" : "rgba(255,224,102,.2)";
      g.strokeStyle = css("--seen"); g.lineWidth = 1.6;
      trace(g, item.bandWorld.map(proj)); g.fill(); g.stroke();
    }
  }
  drawPieces(false); drawFrames(false);
  // view rays to the corners of the usable band
  const corners = [[-HW, -HH], [HW, -HH], [HW, LOW], [-HW, LOW]];
  g.strokeStyle = "rgba(255,224,102,.55)"; g.lineWidth = 1;
  for (const uv of corners) {
    const d = [0, 1, 2].map(i => uv[0] * cam.right[i] + uv[1] * cam.down[i] + F * cam.fwd[i]);
    const norm = Math.hypot(...d);
    let reach = Math.min(2.2 * M.facts.standoff_m, d[2] < 0 ? (0 - cam.C[2]) / d[2] * norm : Infinity);
    for (const wall of WALLS) {
      const den = dot(d, wall.normal);
      if (den >= 0) continue;
      const k = dot(sub(wall.origin, cam.C), wall.normal) / den;
      if (k <= 0) continue;
      const hit = [cam.C[0] + d[0] * k, cam.C[1] + d[1] * k, cam.C[2] + d[2] * k];
      const along = (hit[0] - wall.origin[0]) * wall.face.along[0] + (hit[1] - wall.origin[1]) * wall.face.along[1];
      if (along >= 0 && along <= wall.face.length_m && hit[2] >= BASE && hit[2] <= TOP) reach = Math.min(reach, k * norm);
    }
    const end = [0, 1, 2].map(i => cam.C[i] + d[i] / norm * reach);
    g.beginPath(); g.moveTo(...proj(cam.C)); g.lineTo(...proj(end)); g.stroke();
  }
  // drop line to the ground and the aircraft itself
  g.setLineDash([2, 4]); g.strokeStyle = "rgba(255,255,255,.5)";
  g.beginPath(); g.moveTo(...proj(cam.C)); g.lineTo(...proj([s.x, s.y, 0])); g.stroke(); g.setLineDash([]);
  drawAircraft(g, s, hidden(cam.C, v) ? 0.55 : 1);
  // north arrow
  const pivot = proj([view.cx, view.cy, view.cz]), ahead = proj([view.cx, view.cy + 1, view.cz]);
  const nx = ahead[0] - pivot[0], ny = ahead[1] - pivot[1], nl = Math.hypot(nx, ny);
  if (nl > 1e-6) {
    const bx = w - 44, by = 44, ux = nx / nl, uy = ny / nl;
    g.strokeStyle = "#ffffff"; g.fillStyle = "#ffffff"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx - 16 * ux, by - 16 * uy); g.lineTo(bx + 16 * ux, by + 16 * uy); g.stroke();
    g.beginPath(); g.arc(bx + 16 * ux, by + 16 * uy, 3.5, 0, 7); g.fill();
    g.font = "600 12px system-ui"; g.fillText("N", bx + 27 * ux - 4, by + 27 * uy + 4);
  }
  return views;
}

// ---- camera frame -------------------------------------------------------------------------
function drawFrame(s, views) {
  const canvas = document.getElementById("frame");
  const { g, w } = fit(canvas, Math.round(canvas.clientWidth * HH / HW)), k = w / (2 * HW), h = 2 * HH * k;
  const px = uv => [w / 2 + uv[0] * k, h / 2 + uv[1] * k];
  const cam = camera(s), horizon = h / 2 - F * Math.tan(rad(CAM.pitch_down_deg)) * k;
  g.fillStyle = "#6f8fb3"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#5c6b4f"; g.fillRect(0, Math.max(0, horizon), w, h);
  g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip();
  const drawWorld = (poly, fill, stroke) => {
    const c = clipNear(poly.map(p => toCam(cam, p)));
    if (c.length < 3) return;
    trace(g, c.map(p => px([F * p[0] / p[2], F * p[1] / p[2]])));
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.stroke(); }
  };
  const line = (a, b) => {
    let p = toCam(cam, a), q = toCam(cam, b);
    if (p[2] < 0.05 && q[2] < 0.05) return;
    if (p[2] < 0.05) { const f = (0.05 - p[2]) / (q[2] - p[2]); p = [lerp(p[0], q[0], f), lerp(p[1], q[1], f), 0.05]; }
    if (q[2] < 0.05) { const f = (0.05 - q[2]) / (p[2] - q[2]); q = [lerp(q[0], p[0], f), lerp(q[1], p[1], f), 0.05]; }
    g.beginPath(); g.moveTo(...px([F * p[0] / p[2], F * p[1] / p[2]])); g.lineTo(...px([F * q[0] / q[2], F * q[1] / q[2]]));
    g.stroke();
  };
  if (cam.C[2] > TOP) drawWorld(ROOF, "#8b93a3", "#2a3140");
  for (const item of views) {
    const wall = item.wall, face = wall.face;
    g.lineWidth = 1.2; drawWorld(wall.quad, "#c9cdd6", "#2a3140");
    g.strokeStyle = "rgba(42,49,64,.35)"; g.lineWidth = 0.8;
    for (let z = Math.ceil(BASE) + 1; z < TOP; z += 1) {
      line([face.start[0], face.start[1], z], [face.end[0], face.end[1], z]);
    }
    for (let a = 2; a < face.length_m; a += 2) {
      const x = face.start[0] + face.along[0] * a, y = face.start[1] + face.along[1] * a;
      line([x, y, BASE], [x, y, TOP]);
    }
    if (item.band.length >= 3) {
      trace(g, item.band.map(px)); g.fillStyle = "rgba(255,224,102,.42)"; g.fill();
    }
  }
  g.restore();
  // rows below the steepest usable ray are not counted
  const lowY = h / 2 + LOW * k;
  if (lowY < h - 1) {
    g.fillStyle = "rgba(10,14,20,.55)"; g.fillRect(0, lowY, w, h - lowY);
    g.strokeStyle = css("--seen"); g.setLineDash([6, 4]); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, lowY); g.lineTo(w, lowY); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#e6eaf2"; g.font = "11px system-ui";
    g.fillText("too steep to count", 8, Math.min(h - 6, lowY + 14));
  }
  g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(w / 2 - 8, h / 2); g.lineTo(w / 2 + 8, h / 2);
  g.moveTo(w / 2, h / 2 - 8); g.lineTo(w / 2, h / 2 + 8); g.stroke();
  const filled = views.reduce((sum, item) => sum + area2(item.band), 0) / (2 * HW * (LOW + HH));
  const imaging = windowAt(s.t);
  const state = imaging === "pass" ? "Counting frames on this pass" : imaging === "stop" ? "Stopped: frames counted"
    : s.yawRate > 0.5 ? "Turning to the next yaw: frames not counted" : "Moving: frames not counted";
  document.getElementById("frame-caption").innerHTML =
    `<b>${state}.</b> The structure fills <b>${Math.round(100 * filled)} %</b> of the usable band (yellow).`;
}

// ---- walls unfolded -----------------------------------------------------------------------
const ordered = WALLS.slice().sort((a, b) => a.face.order - b.face.order);
function drawWalls(views) {
  const canvas = document.getElementById("walls"), gap = 14, left = 34, topPad = 22;
  const total = ordered.reduce((sum, wall) => sum + wall.face.length_m, 0);
  const width = canvas.clientWidth, k = (width - left - 10 - gap * (ordered.length - 1)) / total;
  const wallHeight = Math.max(46, Math.min(150, M.wall_m * k));
  const { g, w, h, dpr } = fit(canvas, Math.round(wallHeight + topPad + 26));
  g.clearRect(0, 0, w, h);
  g.font = "11px system-ui";
  let x = left;
  for (const wall of ordered) {
    const face = wall.face, fw = face.length_m * k, ky = wallHeight / M.wall_m;
    g.imageSmoothingEnabled = false;
    affine(g, dpr, wall.texture, [x, topPad], [x + fw, topPad], [x, topPad + wallHeight]);
    g.strokeStyle = "#2c3545"; g.strokeRect(x, topPad, fw, wallHeight);
    g.fillStyle = "#e6eaf2"; g.fillText(`Face ${face.order + 1} · ${face.side} · ${face.length_m.toFixed(1)} m`, x, 14);
    const item = views.find(candidate => candidate.wall === wall);
    if (item && item.band.length >= 3) {
      const flat = item.bandWorld.map(p => [
        x + ((p[0] - face.start[0]) * face.along[0] + (p[1] - face.start[1]) * face.along[1]) * k,
        topPad + (TOP - p[2]) * ky]);
      trace(g, flat); g.fillStyle = "rgba(255,224,102,.45)"; g.fill();
      g.strokeStyle = "#ffffff"; g.lineWidth = 1.5; g.stroke();
    }
    x += fw + gap;
  }
  g.fillStyle = css("--dim");
  g.fillText(`${M.wall_m.toFixed(1)} m`, 2, topPad + 9); g.fillText("0 m", 2, topPad + wallHeight);
}

// ---- timeline -----------------------------------------------------------------------------
function drawTimeline(s) {
  const canvas = document.getElementById("timeline"), { g, w, h } = fit(canvas);
  g.clearRect(0, 0, w, h);
  const left = 12, right = w - 12, at = t => left + (right - left) * t / T;
  for (const step of M.steps) {
    g.fillStyle = COLOR[step.kind]; g.globalAlpha = step.kind === "pass" || step.kind === "corner" ? 1 : 0.55;
    g.fillRect(at(step.t0), 18, Math.max(1, at(step.t1) - at(step.t0) - 0.5), 20);
  }
  g.globalAlpha = 1; g.fillStyle = "#ffffff";
  for (const win of M.windows) g.fillRect(at(win[0]), 12, Math.max(1, at(win[1]) - at(win[0])), 3);
  g.fillStyle = css("--dim"); g.font = "11px system-ui";
  const tick = T > 900 ? 120 : 60;
  for (let t = 0; t <= T; t += tick) { g.fillRect(at(t), 40, 1, 5); g.fillText(fmtTime(t), at(t) - 8, 56); }
  g.fillStyle = css("--seen"); g.fillRect(at(s.t) - 1, 6, 2, 38);
  g.beginPath(); g.arc(at(s.t), 6, 4, 0, 7); g.fill();
}

// ---- page ---------------------------------------------------------------------------------
let now = 0, playing = false, dirty = true, last = null;
function seek(t) { now = Math.max(0, Math.min(T, t)); dirty = true; }
const compass = yaw => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round((((yaw % 360) + 360) % 360) / 45) % 8];
function drawNow(s) {
  const index = stepAt(s.t), step = M.steps[index], yaw = ((s.yaw % 360) + 360) % 360;
  document.getElementById("now-step").textContent = step.label;
  document.getElementById("now-detail").textContent = step.detail;
  const taken = FRAMES.filter(f => f.t <= s.t).length;
  const rows = [["Height above take-off", `${s.z.toFixed(1)} m`], ["Yaw", `${yaw.toFixed(0)}° ${compass(yaw)}`],
    ["Speed", `${s.speed.toFixed(1)} m/s`], ["Yaw rate", `${s.yawRate.toFixed(0)} °/s`],
    ["Frames counted", `${taken} of ${FRAMES.length}`]];
  document.getElementById("now").innerHTML = rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("");
  document.getElementById("clock").textContent = `${fmtTime(s.t)} / ${fmtTime(T)}`;
  document.querySelectorAll("#steps li").forEach((li, i) => {
    const on = i === index;
    if (on && !li.classList.contains("on")) {
      const list = li.parentElement;
      list.scrollTop = li.offsetTop - list.offsetTop - list.clientHeight / 2 + li.clientHeight / 2;
    }
    li.classList.toggle("on", on);
  });
}
function render() {
  const s = stateAt(now), views = drawScene(s);
  drawFrame(s, views); drawWalls(views); drawTimeline(s); drawNow(s);
}
function loop(stamp) {
  if (playing && last !== null) {
    now += (stamp - last) / 1000 * Number(document.getElementById("rate").value);
    if (now >= T) { now = T; playing = false; document.getElementById("play").textContent = "Play"; }
    dirty = true;
  }
  last = stamp;
  if (dirty) { dirty = false; render(); }
  requestAnimationFrame(loop);
}
function setup() {
  const facts = M.facts;
  document.getElementById("title").textContent = `${M.title} · plan ${M.plan_sha256.slice(0, 10)}`;
  const verdict = document.getElementById("verdict");
  verdict.textContent = M.passed ? "pointing check passed" : "check failed";
  verdict.className = "badge " + (M.passed ? "ok" : "no");
  const fact = (name, value) => `<span>${name} <b>${value}</b></span>`;
  document.getElementById("facts").innerHTML = [
    fact("flight", `${facts.estimated_minutes.toFixed(1)} of ${facts.budget_minutes} min`),
    fact("stand-off", `${facts.standoff_m} m`),
    fact("speed", `${facts.speed_m_s} m/s (${facts.binding_speed_limit.replace("_", " ")} limit)`),
    fact("GSD on wall", `${facts.gsd_cm_finest.toFixed(2)}–${facts.gsd_cm_coarsest.toFixed(2)} cm`),
    fact("passes", `${facts.passes} at ${facts.pass_heights_m.map(z => z.toFixed(1)).join(", ")} m`),
    fact("corner stops", facts.corner_stops),
    fact("every wall point seen from", `≥ ${facts.min_lines} lines (need ${M.needed.lines})`),
    fact("closest to structure", `${facts.closest_to_structure_m.toFixed(1)} m`),
    fact("camera", `${CAM.pitch_down_deg}° ± ${facts.pitch_tolerance_deg}° down`)].join("");
  const kinds = [...new Set(M.steps.map(step => step.kind))].filter(kind => ["pass", "corner", "reposition"].includes(kind));
  const cover = [[0, "not seen"], [M.needed.lines, `${M.needed.lines} lines`], [M.needed.lines + 1, "more"]];
  document.getElementById("legend").innerHTML =
    kinds.map(kind => `<span><i style="background:${COLOR[kind]}"></i>${KIND_NAME[kind]}</span>`).join("") +
    `<span><i style="background:${COLOR.transit}"></i>transit</span>` +
    `<span><i style="background:${css("--seen")}"></i>usable view now</span>` +
    cover.map(c => `<span><i style="background:${coverColor(c[0])}"></i>${c[1]}</span>`).join("");
  const list = document.getElementById("steps");
  M.steps.forEach(step => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot" style="background:${COLOR[step.kind]}"></span>` +
      `<span>${step.label}<small>${step.detail}</small></span><time>${fmtTime(step.t0)}</time>`;
    li.addEventListener("click", () => seek(step.t0 + 0.01));
    list.appendChild(li);
  });
  document.getElementById("notes").innerHTML =
    M.warnings.concat(M.limitations).map(text => `<li>${text}</li>`).join("");
  document.getElementById("walls-caption").innerHTML =
    `Each wall point must be seen sharply from <b>${M.needed.lines}</b> passes, with <b>${M.needed.frames}</b> ` +
    `frames on each. The outlined patch is the usable view at the current time. Corner stops are extra views ` +
    `that join one face to the next; they are not counted here.`;
  document.getElementById("footer").textContent =
    `${M.imagery.attribution}. The map is a backdrop; the coordinates in the plan are what the aircraft flies. ` +
    `Aircraft ${facts.aircraft}. Camera pitch: ${facts.pitch_source}.`;

  const play = document.getElementById("play");
  const toggle = () => {
    if (!playing && now >= T) now = 0;
    playing = !playing; play.textContent = playing ? "Pause" : "Play"; dirty = true;
  };
  play.addEventListener("click", toggle);
  document.getElementById("prev").addEventListener("click", () => seek(M.steps[Math.max(0, stepAt(now - 0.02) - (now - M.steps[stepAt(now)].t0 < 1 ? 1 : 0))].t0 + 0.01));
  document.getElementById("next").addEventListener("click", () => seek(M.steps[Math.min(M.steps.length - 1, stepAt(now) + 1)].t0 + 0.01));
  document.addEventListener("keydown", event => {
    if (event.target.tagName === "SELECT" || event.target.tagName === "INPUT") return;
    if (event.key === " ") { event.preventDefault(); toggle(); }
    if (event.key === "ArrowRight") seek(now + (event.shiftKey ? 10 : 1));
    if (event.key === "ArrowLeft") seek(now - (event.shiftKey ? 10 : 1));
  });
  const timeline = document.getElementById("timeline");
  const scrub = event => {
    const box = timeline.getBoundingClientRect();
    seek((event.clientX - box.left - 12) / (box.width - 24) * T);
  };
  timeline.addEventListener("pointerdown", event => { timeline.setPointerCapture(event.pointerId); scrub(event); });
  timeline.addEventListener("pointermove", event => { if (event.buttons) scrub(event); });

  const scene = document.getElementById("scene");
  let drag = null;
  scene.addEventListener("pointerdown", event => {
    scene.setPointerCapture(event.pointerId);
    drag = { x: event.clientX, y: event.clientY, pan: event.shiftKey || event.button === 1 };
  });
  scene.addEventListener("pointermove", event => {
    if (!drag || !event.buttons) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (drag.pan) {
      const ca = Math.cos(view.az), sa = Math.sin(view.az);
      const across = dx / view.scale, away = -dy / (view.scale * Math.max(0.25, Math.sin(view.el)));
      view.cx -= across * ca + away * sa; view.cy -= -across * sa + away * ca;
    } else {
      view.az += dx * 0.008;
      view.el = Math.max(0.02, Math.min(Math.PI / 2, view.el + dy * 0.008));
    }
    drag.x = event.clientX; drag.y = event.clientY; dirty = true;
  });
  scene.addEventListener("pointerup", () => { drag = null; });
  scene.addEventListener("wheel", event => {
    event.preventDefault();
    view.scale *= Math.exp(-event.deltaY * 0.0012); dirty = true;
  }, { passive: false });
  const preset = (az, el) => () => {
    document.getElementById("follow").checked = false;
    Object.assign(view, { az: rad(az), el: rad(el), cx: hullCentre[0], cy: hullCentre[1], cz: TOP / 2 });
    resetScale(); dirty = true;
  };
  document.getElementById("view-oblique").addEventListener("click", preset(-32, 34));
  document.getElementById("view-top").addEventListener("click", preset(0, 90));
  document.getElementById("view-side").addEventListener("click", preset(0, 4));
  for (const id of ["follow", "satellite", "show-frames"]) {
    document.getElementById(id).addEventListener("change", () => { dirty = true; });
  }
  window.addEventListener("resize", () => { dirty = true; });

  // #t=120&az=40&el=30&play=1&sat=0 opens the view at a chosen moment.
  const options = new URLSearchParams(location.hash.slice(1));
  const firstPass = M.steps.find(step => step.kind === "pass");
  now = options.has("t") ? Number(options.get("t")) : firstPass ? (firstPass.t0 + firstPass.t1) / 2 : 0;
  if (options.has("az")) view.az = rad(Number(options.get("az")));
  if (options.has("el")) view.el = rad(Number(options.get("el")));
  if (options.get("sat") === "0") document.getElementById("satellite").checked = false;
  if (options.get("play") === "1") toggle();
  requestAnimationFrame(loop);
}
setup();
</script>
</body>
</html>
