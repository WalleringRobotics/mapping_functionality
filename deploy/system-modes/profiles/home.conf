# Bench at home: desktop available, Wi-Fi on, services as installed.
DESCRIPTION="bench at home: desktop, Wi-Fi, 25 W"
POWER_MODE=25W          # a NAME from /etc/nvpmodel.conf: 15W, 25W, MAXN_SUPER
FAN_PROFILE=quiet       # quiet or cool (/etc/nvfancontrol.conf)
BOOT=desktop            # desktop or headless
WIFI=on
BLUETOOTH=on
TRIM_SERVICES=no        # no = restore optional services to their state at install
RECORDING=no            # wr-mode ensure refuses profiles that are not for recording
