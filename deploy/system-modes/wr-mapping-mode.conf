# Installed by install.sh as /etc/systemd/system/wr-mapping.service.d/wr-mode.conf
# Puts the Orin into its recording profile before wr-mapping.service records,
# and stops the start if it cannot get there. "+" runs this one step as root
# despite User=wr-mapping and NoNewPrivileges=yes in the unit.
# Profile: WR_MODE_RECORD_PROFILE in /etc/wallering-mapping.env, default field.
[Service]
ExecStartPre=+/usr/local/sbin/wr-mode ensure
