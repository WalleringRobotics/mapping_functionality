name: PX4 SIH mission
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sitl.yml'
      - 'deploy/build-px4-sitl.sh'
      - 'deploy/verify-calibration-sitl.py'
      - 'docker/sitl.Dockerfile'
      - 'src/wallering_mapping/calibration_mission.py'
      - 'tests/test_calibration_sitl.py'
permissions:
  contents: read
jobs:
  upstream-px4:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PX4/PX4-Autopilot
          # The build wrapper additionally verifies the resolved commit SHA.
          ref: v1.17.0
          path: runs/px4-sitl/PX4-Autopilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare upstream build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build
          git -C runs/px4-sitl/PX4-Autopilot submodule update --init --recursive --depth 1 \
            --jobs 2 src/modules/mavlink/mavlink src/drivers/gps/devices \
            src/lib/events/libevents src/modules/uxrce_dds_client/Micro-XRCE-DDS-Client \
            src/lib/heatshrink/heatshrink src/lib/cdrstream/cyclonedds src/lib/cdrstream/rosidl
          python -m pip install -r runs/px4-sitl/PX4-Autopilot/Tools/setup/requirements.txt \
            'numpy==1.26.4' 'pymavlink==2.4.50' 'pyproj==3.7.1' ninja
          python -m pip freeze > runs/px4-sitl/python-freeze.txt
          git -C runs/px4-sitl/PX4-Autopilot submodule status --recursive > runs/px4-sitl/submodules.txt
      - name: Build real upstream PX4 and isolated runtime
        id: build
        run: |
          bash deploy/build-px4-sitl.sh runs/px4-sitl/PX4-Autopilot "$(command -v python)" 4 \
            2>&1 | tee runs/px4-sitl/build.log
          docker build -f docker/sitl.Dockerfile -t wallering-sitl .
      - name: Generate the exact synthetic-site mission
        id: plan
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from wallering_mapping.calibration_mission import generate_mission
          generate_mission((47.397742, 8.545594), 489.4, 8, 2, 5, 15, 8, 15,
                           Path('runs/px4-sitl/calibration.plan'), altitude_step=1, yaw_hold=2)
          PY
      - name: Execute the mission in loopback-only SIH
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD" --workdir "$PWD" \
            wallering-sitl deploy/verify-calibration-sitl.py \
            --px4-build runs/px4-sitl/PX4-Autopilot/build/px4_sitl_default \
            --plan runs/px4-sitl/calibration.plan --output runs/px4-sitl/mission-001
      - name: Exercise Hold then Land in a fresh SIH instance
        if: always() && steps.build.outcome == 'success' && steps.plan.outcome == 'success'
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD" --workdir "$PWD" \
            wallering-sitl deploy/verify-calibration-sitl.py \
            --px4-build runs/px4-sitl/PX4-Autopilot/build/px4_sitl_default \
            --plan runs/px4-sitl/calibration.plan --output runs/px4-sitl/abort-001 --mode abort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px4-sih-evidence
          path: |
            runs/px4-sitl/build.log
            runs/px4-sitl/python-freeze.txt
            runs/px4-sitl/submodules.txt
            runs/px4-sitl/calibration.plan*
            runs/px4-sitl/mission-001/**
            runs/px4-sitl/abort-001/**
