name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,bags,processing,terrain,diagnostics]'
      - run: ruff check src tests deploy/check-mavros-gnss.py deploy/record.launch.py deploy/record-resources.py
      - run: pytest -q
      - name: Exercise installed CLI without camera
        run: |
          wr-map simulate --output /tmp/mapping-fixture --frames 6
          wr-map validate /tmp/mapping-fixture
          wr-map export /tmp/mapping-fixture --output /tmp/mapping-export
          wr-map reconstruct /tmp/mapping-export --output /tmp/mapping-plan

          wr-map process /tmp/mapping-fixture --config configs/process-building.json --output /tmp/mapping-run --prepare-only
          wr-map process /tmp/mapping-fixture --config configs/process-building.json --output /tmp/mapping-run --prepare-only --resume
  mavros-ros2:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS message types and Python test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip ros-humble-mavros-msgs ros-humble-geometry-msgs ros-humble-sensor-msgs ros-humble-rosidl-runtime-py
          python3 -m pip install --upgrade pip 'setuptools>=68,<80' wheel
          python3 -m pip install -e '.[dev]'
      - name: Exercise ROS services, DDS and launch lifecycle
        run: |
          source /opt/ros/humble/setup.bash
          python3 -c 'import rclpy, mavros_msgs, geometry_msgs, sensor_msgs, rosidl_runtime_py'
          pytest -q tests/test_mavros_ros2.py tests/test_ros_recorder.py
  image:
    # Same architecture as the Orin; proves a clean checkout builds the runtime.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: wallering-mapping:humble
          load: true
          build-args: BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the complete suite, including ROS and PyCOLMAP, in the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD" --workdir "$PWD" \
            --env "PYTHONPATH=$PWD/src" --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            wallering-mapping:humble bash -c '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              python -c "import pycolmap, depthai, rclpy, mavros_msgs"
              for p in depthai_ros_driver mavros mavros_extras rosbag2_storage_mcap; do ros2 pkg prefix "$p"; done
              python -m pytest -q
            '
  postprocessing-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up the native x86-64 processing workstation
        run: bash deploy/setup-postprocessing.sh
      - name: Exercise upstream OpenSfM sparse and dense processing
        run: |
          .venv-postprocess/bin/python deploy/check-opensfm.py \
            --output runs/ci-opensfm --execute
          .venv-postprocess/bin/python deploy/check-opensfm.py \
            --output runs/ci-opensfm --execute --resume
      - name: Check real GDAL and PDAL product validation
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --entrypoint /code/venv/bin/python3 opendronemap/odm:3.6.2 \
            "$PWD/deploy/check-odm-products.py"
      - name: Run native ODM on pinned public aerial photographs
        run: |
          git init /tmp/wr-odm-example
          git -C /tmp/wr-odm-example fetch --depth 1 \
            https://github.com/pierotofy/drone_dataset_brighton_beach.git \
            9506a9bf09c9678b7d0b80b014af5b606c8a7255
          git -C /tmp/wr-odm-example checkout --detach FETCH_HEAD
          mkdir -p runs/ci-odm/site
          cp -a /tmp/wr-odm-example/images runs/ci-odm/site/images
          cp /tmp/wr-odm-example/LICENSE runs/ci-odm/SOURCE-LICENSE
          .venv-postprocess/bin/python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('runs/ci-odm')
          provenance = {
              'source': 'https://github.com/pierotofy/drone_dataset_brighton_beach',
              'revision': '9506a9bf09c9678b7d0b80b014af5b606c8a7255',
              'image': json.loads(subprocess.check_output([
                  'docker', 'image', 'inspect', 'opendronemap/odm:3.6.2']))[0]['Id'],
              'images_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in sorted((root / 'site/images').iterdir())},
              'qualification': 'Public example software test; EXIF GPS only, no independent accuracy claim',
          }
          (root / 'source.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 \
            --mount "type=bind,src=$PWD/runs/ci-odm,dst=/datasets" \
            opendronemap/odm:3.6.2 --project-path /datasets --max-concurrency 2 \
            --feature-quality medium --pc-quality low --skip-3dmodel --skip-report \
            --dsm --orthophoto-resolution 20 --dem-resolution 50 site \
            > runs/ci-odm/engine.log 2>&1
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 \
            --mount "type=bind,src=$PWD/runs/ci-odm/site,dst=/site,readonly" \
            --mount "type=bind,src=$PWD/src/wallering_mapping/odm_products.py,dst=/inspect-products.py,readonly" \
            --entrypoint /code/venv/bin/python3 opendronemap/odm:3.6.2 \
            /inspect-products.py /site > runs/ci-odm/product-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensfm-x86-evidence
          path: |
            runs/ci-opensfm/report.json
            runs/ci-opensfm/workflow/workflow.json
            runs/ci-opensfm/**/quality.json
            runs/ci-opensfm/**/run.json
            runs/ci-opensfm/**/logs/*.log
            runs/ci-opensfm/**/dataset/reconstruction.json
            runs/ci-opensfm/**/dataset/reconstruction.ply
            runs/ci-opensfm/**/dataset/undistorted/depthmaps/merged.ply
            runs/ci-odm/engine.log
            runs/ci-odm/product-validation.json
            runs/ci-odm/source.json
            runs/ci-odm/SOURCE-LICENSE
            runs/ci-odm/site/opensfm/reconstruction.json
            runs/ci-odm/site/odm_orthophoto/odm_orthophoto.tif
            runs/ci-odm/site/odm_dem/dsm.tif
            runs/ci-odm/site/odm_georeferencing/odm_georeferenced_model.laz
